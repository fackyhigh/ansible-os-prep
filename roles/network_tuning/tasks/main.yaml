---
- name: Locate the netplan configuration file for the active interface
  ansible.builtin.find:
    paths: /etc/netplan
    patterns:
      - "*.yaml"
      - "*.yml"
  register: netplan_cfg_files
  when: ansible_facts[network_interface_rename] is not defined

- name: Fail if no netplan configuration file could be found
  ansible.builtin.fail:
    msg: "Critical: Could not find any netplan configuration file under /etc/netplan."
  when:
    - ansible_facts[network_interface_rename] is not defined
    - netplan_cfg_files is defined
    - netplan_cfg_files.files | length == 0

- name: Skip renaming because the target interface already exists
  ansible.builtin.debug:
    msg: "Interface is already renamed to '{{ network_interface_rename }}', nothing to do."
  when: ansible_facts[network_interface_rename] is defined

- name: Process interface renaming if active interface is found and not yet renamed
  block:
    - name: Dynamically detect the active system network interface
      ansible.builtin.set_fact:
        active_interface: >-
          {{
            ansible_facts['interfaces']
            | map('extract', ansible_facts)
            | selectattr('ipv4', 'defined')
            | rejectattr('device', 'equalto', 'lo')
            | selectattr('active', 'defined')
            | selectattr('active')
            | map(attribute='device')
            | first
          }}

    - name: Fail if no active interface could be automatically discovered
      ansible.builtin.fail:
        msg: "Critical: Could not automatically detect an active network interface with an IPv4 address and active=true. Got: '{{ active_interface | default('') }}'"
      when: active_interface is not defined or not active_interface

    - name: Display detected interface before renaming operations
      ansible.builtin.debug:
        msg: "Detected active interface: '{{ active_interface }}' (MAC: {{ ansible_facts[active_interface]['macaddress'] | default('Unknown') }}). Changing to '{{ network_interface_rename }}' in netplan..."

    - name: Update the interface name in the netplan configuration
      ansible.builtin.lineinfile:
        path: "{{ netplan_cfg_files.files[0].path }}"
        regexp: '^(\s*)set-name:.*'
        line: '\1set-name: "{{ network_interface_rename }}"'
        backrefs: false
        state: present
      notify: "reboot interface rename"

    - name: Notify that renaming will be applied on next reboot via netplan
      ansible.builtin.debug:
        msg:
          - "=== INTERFACE RENAME SCHEDULED ==="
          - "New Interface Name: {{ network_interface_rename }}"
          - "Current Interface: {{ active_interface }}"
          - "Netplan config updated: {{ netplan_cfg_files.files[0].path }}"
          - "The rename will take effect after the next system reboot."

  when: ansible_facts[network_interface_rename] is not defined

  rescue:
    - name: Restore the original interface name in the netplan configuration
      ansible.builtin.lineinfile:
        path: "{{ netplan_cfg_files.files[0].path }}"
        regexp: '^(\s*)set-name:.*'
        line: '\1set-name: "{{ active_interface }}"'
      when: active_interface is defined

    - name: Handle interface renaming operational failure
      ansible.builtin.fail:
        msg: "Failed during the automatic discovery or renaming process for network interfaces."