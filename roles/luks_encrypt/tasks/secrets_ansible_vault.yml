---
- name: Resolve LUKS passphrase from Ansible Vault
  ansible.builtin.set_fact:
    luks_resolved_passphrase: "{{ vault_luks_passphrase }}"

- name: Fail if vault passphrase is not provided
  ansible.builtin.fail:
    msg: >-
      Provider 'ansible_vault' requires 'vault_luks_passphrase' to be defined
      (e.g. via --extra-vars or an Ansible-Vault encrypted vars file).
  when: luks_resolved_passphrase == ''