---
# Получение секрета из переменных окружения контроллера Ansible
- ansible.builtin.set_fact:
    luks_resolved_passphrase: "{{ lookup('ansible.builtin.env', 'LUKS_ENV_PASSPHRASE') }}"
- ansible.builtin.fail:
    msg: "Environment variable 'LUKS_ENV_PASSPHRASE' is missing or unassigned."
  when: luks_resolved_passphrase == ""
