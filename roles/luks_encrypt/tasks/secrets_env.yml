---
# Получение секрета из переменных окружения контроллера Ansible
- name: Resolve LUKS passphrase from environment variable
  ansible.builtin.set_fact:
    luks_resolved_passphrase: "{{ lookup('ansible.builtin.env', luks_env_passphrase_env_var) | default('') }}"

- name: Fail if environment variable is unset or empty
  ansible.builtin.fail:
    msg: "Environment variable '{{ luks_env_passphrase_env_var }}' is missing or unset."
  when: luks_resolved_passphrase == ''