- name: Print root partition name
  ansible.builtin.debug:
    # msg: "{{ root_partition }}"
    msg: "{{ ansible_facts['devices'] | dict2items  }}"

# - name: Determine disk hosting the root partition (Supports standard and NVMe layout)
#   ansible.builtin.set_fact:
#     root_disk: "{{ root_mount.device | regex_replace('(p[0-9]+|[0-9]+)$', '') }}"

- name: Print root disk name
  ansible.builtin.debug:
    msg: "{{ root_disk }}"

- name: Scan and identify the second physical disk without root
  ansible.builtin.set_fact:
    second_disk: >-
      {{ 
        (ansible_facts['devices'].keys() 
        | map('regex_replace', '^', '/dev/') 
        | reject('equalto', root_disk) 

        | reject('search', 'loop|ram|dm-') 
        | list) 
        | first 
      }}

- name: Print second disk name
  ansible.builtin.debug:
    msg: "{{ second_disk }}"
  when: second_disk is defined

- name: Fail if secondary usable storage media is missing
  ansible.builtin.fail:
    msg: "Critical: No secondary disk available without root partition."
  when: second_disk is not defined or not second_disk

- name: Initialize empty partition lists for dynamic orchestration
  ansible.builtin.set_fact:
    partitions_to_encrypt: []

- name: Inspect secondary partition status
  block:
    - name: Verify if user specified partition exists on target host
      ansible.builtin.stat:
        path: "{{ target_second_disk_partition }}"
      register: target_part_stat

    - name: Analyze active mountpoints for the target partition
      ansible.builtin.set_fact:
        matching_mount: "{{ ansible_mounts | selectattr('device', 'equalto', target_second_disk_partition) | list }}"

    - name: Notify user if designated partition is locked/mounted
      ansible.builtin.debug:
        msg: "Warning: Partition {{ target_second_disk_partition }} is already active/mounted. Skipping encryption."
      when: matching_mount | length > 0

    - name: Track existing unmounted partition for target sequence
      ansible.builtin.set_fact:
        partitions_to_encrypt: "{{ partitions_to_encrypt + [ {'dev': target_second_disk_partition, 'mount': '/mnt/task1'} ] }}"
      when: 
        - target_part_stat.stat.exists
        - matching_mount | length == 0

    - name: Print partitions to encrypt
      ansible.builtin.debug:
        msg: "{{ partitions_to_encrypt }}"

