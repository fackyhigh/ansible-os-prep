- name: Identify parallel partitions sitting next to root on root disk (Задание 1.2)
  ansible.builtin.set_fact:
    adjacent_partitions: "{{ ansible_facts['devices'][root_disk | basename]['partitions'].keys() | map('regex_replace', '^', root_disk) | reject('equalto', root_mount.device) | list }}"

- name: Print partitions to encrypt
  ansible.builtin.debug:
    msg: "{{ adjacent_partitions }}"

- name: Queue verified adjacent root-disk partition structures
  ansible.builtin.set_fact:
    partitions_to_encrypt: "{{ partitions_to_encrypt + [ {'dev': item, 'mount': '/mnt/task1'} ] }}"
  loop: "{{ adjacent_partitions }}"
  when: adjacent_partitions | length > 0

- name: Print partitions to encrypt
  ansible.builtin.debug:
    msg: "{{ partitions_to_encrypt }}"

