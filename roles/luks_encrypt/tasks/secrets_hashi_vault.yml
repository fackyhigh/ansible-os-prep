---
# Получение секрета из HashiCorp Vault kv-хранилища
- name: Fetch password from HashiCorp Vault
  set_fact:
    luks_resolved_passphrase: "{{ lookup('community.general.hashi_vault', 'secret=secret/data/storage/luks:password token=' ~ lookup('env', 'VAULT_TOKEN') ~ ' url=http://127.0.0.1:8200') }}"
  failed_when: luks_resolved_passphrase | length == 0
