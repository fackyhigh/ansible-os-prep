---
# Получение секрета из HashiCorp Vault kv-хранилища
- name: Fetch password from HashiCorp Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ hashi_vault_url }}"
    path: "{{ hashi_vault_secret_path }}"
    token: "{{ lookup('ansible.builtin.env', hashi_vault_token_env_var) }}"
  register: vault_secret
  failed_when: vault_secret is not defined or vault_secret is none

- name: Resolve LUKS passphrase from fetched Vault secret
  ansible.builtin.set_fact:
    luks_resolved_passphrase: "{{ vault_secret.secret[hashi_vault_secret_field] | default('') }}"

- name: Fail if Vault field is empty
  ansible.builtin.fail:
    msg: >-
      Field '{{ hashi_vault_secret_field }}' is missing or empty in
      Vault path '{{ hashi_vault_secret_path }}'.
  when: luks_resolved_passphrase == ''