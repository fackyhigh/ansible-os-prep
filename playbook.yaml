---
- name: Prepare OS Configuration (LUKS, CPU, Network)
  hosts: target_servers
  become: true
  
  roles:
    - role: luks_encrypt
    # - role: cpu_tuning
    # - role: network_tuning

  tasks:
  - name: Gather final CPU and Multi-threading topology metrics
    block:
      - name: Collect system facts explicitly
        ansible.builtin.setup:
          gather_subset:
            - hardware
      - name: Display CPU List and Threading Capability
        ansible.builtin.debug:
          msg:
            - "=== CPU TOPOLOGY INFORMATION ==="
            - "Total Logical CPUs: {{ ansible_facts['processor_vcpus'] }}"
            - "CPU Model: {{ ansible_facts['processor'] | default('Unknown') }}"
            - "Cores per Socket: {{ ansible_facts['processor_cores'] }}"
            - "Threads per Core: {{ ansible_facts['processor_threads_per_core'] | default('N/A') }}"
            - "Hyper-Threading/SMT Enabled: {{ 'Yes' if (ansible_facts['processor_threads_per_core'] | default(1) > 1) else 'No' }}"
